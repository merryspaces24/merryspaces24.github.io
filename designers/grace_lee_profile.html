
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Lee - Interior Designer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 800px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; }
        p.location { font-style: italic; text-align: center; }
        .portfolio-images img { width: 100%; max-width: 250px; margin: 10px; border-radius: 8px; }
        .portfolio-images { display: flex; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grace Lee</h1>
        <p class="location">Palm Beach, FL</p>
        <p>Grace's designs exude elegance and sophistication, often incorporating Art Deco elements.</p>
        <h2>Portfolio</h2>
        <div class="portfolio-images">
            <img src="https://source.unsplash.com/250x200/?interior,home" alt="Portfolio Image 1">
            <img src="https://source.unsplash.com/250x200/?interior,room" alt="Portfolio Image 2">
            <img src="https://source.unsplash.com/250x200/?interior,design" alt="Portfolio Image 3">
        </div>
    </div>
</body>
</html>
