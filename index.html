
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interior Design Contact Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 40px; color: #333; }
    form { background: white; padding: 30px; max-width: 500px; margin: auto; border-radius: 10px;
           box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { background-color: #6c675f; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background-color: #56524b; }
  </style>
</head>
<body>

<h2 style="text-align:center;">Book Your Consultation</h2>

<form action="https://formspree.io/f/mkgroenn" method="POST">
  <label for="email">Your Email</label>
  <input name="Email" id="email" type="email" required>
  
  <label for="name">Your Name</label>
  <input name="Name" id="name" type="text" required>

  <label for="phone">Phone Number</label>
  <input name="Phone" id="phone" type="tel" required>

  <label for="date">Preferred Date & Time</label>
  <input name="Appointment" id="date" type="datetime-local" required>

  <label for="message">Project Description</label>
  <textarea name="Message" id="message" rows="5" required></textarea>

  <button type="submit">Submit Request</button>
</form>

</body>
</html>
